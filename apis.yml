aid: illume-labs
name: Illume Labs
description: >-
  Illume Labs is a Y Combinator (Summer 2026) startup building a 24/7 AI
  personal health and longevity companion. Its platform is designed to connect a
  user's wearables, blood panels, and genomic data, then text them personalized,
  actionable insights — detecting patterns across data sources, answering health
  questions conversationally, and offering an interactive surface for deeper
  exploration of longevity signals. As of mid-2026 the company is pre-launch and
  operates a single marketing landing page ("A new lens on longevity") on Vercel
  with no public API, developer portal, SDK, or documentation surface yet
  published. This profile remains a network lead pending a public developer
  surface to enrich.
